<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inox Movies</title>
    <link rel="stylesheet" href="../node_modules/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../node_modules/bootstrap/dist/css/bootstrap.css">
    <script src="../node_modules/bootstrap/dist/js/bootstrap.bundle.js"></script>
    <script src="../src/scripts/inox.js"></script>
</head>
<body class="container-fluid">

    <div id="ButtonContainer" class="mt-2">

        <button data-bs-toggle="modal" data-bs-target="#booking" class="btn btn-primary">Quick Booking</button>

    </div>

    <div class="modal fade" id="booking">

        <div class="modal-dialog modal-fullscreen">

            <div class="modal-content">

                <div class="modal-header">

                    <h4 id="lblHeader">Quick Booking</h4>

                    <button class="btn btn-close" data-bs-dismiss="modal"></button>

                </div>

                <div class="modal-body ">

                        <div class="d-flex flex-row align-items-baseline justify-content-between">

                        <select class="form-select" id="lstMovie">

                            <option>Select Movie</option>

                            <option>MIRZAPUR</option>

                            <option>HANUMAN ANSH</option>

                        </select>

                        <select class="form-select" id="lstDate">

                            <option>Select Date</option>

                            <option>04 Sep 2026</option>

                            <option>05 Sep 2026</option>

                        </select>

                        <select class="form-select" id="lstCinema">

                            <option>Select Cinema</option>

                            <option>PVR Ameerpet</option>

                            <option>INOX B'Hills</option>

                        </select>

                        <select class="form-select" id="lstTiming">

                            <option>Select Timing</option>

                            <option>10:30 AM</option>

                            <option>10:20 PM</option>

                        </select>

                        <button onclick="BookClick()" id="btnBook" data-bs-dismiss="modal" class="btn btn-primary">Book</button>

                       </div>   

                </div>

            </div>

        </div>

    </div>



    <div id="SummaryContainer" class="w-25" style="display: none;"> 

        <div class="card w-100 m-2">

            <div class="card-header">

                <h5 class="d-flex justify-content-between"> <span class="bi bi-ticket-detailed"></span> Booking Summary</h5>

            </div>

            <div class="card-body">

                <img id="imgPoster" class="w-100" height="200">

                <div class="mt-2">

                    <dl>

                        <dt>Movie</dt>

                        <dd id="lblMovie"></dd>

                        <dt>Date</dt>

                        <dd id="lblDate"></dd>

                        <dt>Cinema</dt>

                        <dd id="lblCinema"></dd>

                        <dt>Timing</dt>

                        <dd id="lblTiming"></dd>

                    </dl>

                </div>

            </div>

            <div class="card-footer">

                <button data-bs-toggle="modal" onclick="ModifyClick()" data-bs-target="#booking" class="btn w-100 btn-warning bi bi-pen-fill"> Modify Booking</button>

            </div>

        </div>

    </div>

</body>

</html>
