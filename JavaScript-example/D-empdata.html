<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="stylesheet" href="../node_modules/bootstrap-icons/font/bootstrap-icons.css">

    <script src="../src/scripts/emp.js"></script>
</head>
<body onload="empLoad()" class="container-fluid bg-body-secondary d-flex ">

            <div class="display-4">

                <hr>
            </div>
        </div>

        </div>
        <div>
            <b>Role</b>
            <input type="text" class="form-control p-3" placeholder="Enter Employee Role" id="lblrole">
        </div>
        <button onclick="addEmp()" class="btn btn-success bi bi-person-add "> Add Employee</button>

    </div>
    <div class="col col-5 p-4" >

            <div class="input-group">

        </div>
            
        </div>
