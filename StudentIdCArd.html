<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card{
            width: 300px;
            padding:20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px black;
            text-align: center;
        }
        .i{
            background-color: aqua;
            border-radius: 50%;
        }
        button{
            width: 100%;
            padding: 5px;
            border-radius: 10px;
        }

        .info{
            grid-template-rows: 6fr 6fr;
            padding-left: 10px;
            
        }

        span{
            text-align: left;
        }

        ul{
            display: flex;
            list-style: none;
            
        }
        
        
    </style>
</head>
<body>
    <div class="card">
        
        <img height="50" width="200" src="./public/images/nareshitechnologies-png-logo.png" alt="banner">

        <div class="profile">
            <img class="i" height="150" width="150" src="../public/images/Student.jpg" alt="profile photo">
        </div>
        <div class="details">

            <div class="info"><br>
                <span><strong>Name</strong></span>
                <span>Bharat</span>
            </div>
            <hr>
            <div class="info">
                <span><strong>DOB</strong></span>
                <span>04-06-2016</span>
            </div>
            <hr>
            <div class="info">
                <span><strong>Course</strong></span>
                <span>Java Full Stack</span>
            </div>
            <hr>
            <div class="info">
                <span><strong>Blood Group</strong></span>
                <span>O <sup>+</sup></span>
            </div>
            <hr>
            <div class="info">
                <span><strong>Phone</strong></span>
                <span>+91 9874695***</span>
            </div>
        </div>
        <div><br>
            <button>Student Identity Card</button>
        </div>
    </div>
</body>
</html>
