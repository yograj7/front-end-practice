<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../node_modules/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../node_modules/bootstrap/dist/css/bootstrap.css">
    <script src="../node_modules/bootstrap/dist/js/bootstrap.bundle.js"></script>

</head>

<body class="d-flex justify-content-center p-5">
    <form class="border border-2 p-4 rounded w-25">
        <div class="fw-bold fs-4 text-center bi bi-person-fill"> User Register</div>
        <div class="mb-3">
            <label class="form-label fw-bold">User Name</label>
            <div>
                <input type="text" class="form-control">
            </div>
        </div>
        <div class="mb-3">
            <label class="form-label fw-bold">Password</label>
            <div>
                <input type="password" class="form-control">
            </div>
        </div>
        <div class="mb-3">
            <label class="form-label fw-bold">Your City</label>
            <div>
                <select class="form-select">
                    <option>Select City</option>
                    <option>Delhi</option>
                    <option value="Mumbai">Mumbai</option>
                </select>
            </div>
        </div>

        <div cla>
            <label for="" class="form-label fw-bold">Select course</label>
            <div class="d-flex justify-content-evenly">
                <input type="radio" name="a" id="" class="form-check-input">html
                <input type="radio" name="a" id="" class="form-check-input">css
                <input type="radio" name="a" id="" class="form-check-input">js
                <input type="radio" name="a" id="" class="form-check-input">Java
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label fw-bold">Rating</label>
            <div>
                <input type="range" class="form-range" min="1" max="5">
            </div>
        </div>
        <div class="mb-3">
            <label class="form-label fw-bold">Subscribe</label>
            <div class="form-switch">
                <input type="checkbox" class="form-check-input "> <label class="form-check-label ">Yes</label>
            </div>
        </div>
        <div>
            <button class="btn btn-warning w-100">Register</button>
        </div>
    </form>
</body>
</html>
