
<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Document</title>

    <style>

        nav {

            text-align: center;

            font-size: 25px;
            
        }

          .card {

            width: 250px;

            border:1px solid gray;

            margin: 20px;

            border-radius: 10px;

            font-family: Arial;

            display: none;

        }

        .card:target {

            background-color: rgba(114, 136, 137, 0.316);

            color:white;

            display: block;
            

        }

        .card-img {

            width: 100%;

            border-top-left-radius: 10px;

            border-top-right-radius: 10px;

            height:150px;

        }

        .card-body {

            height: 200px;

            padding: 20px;

        }

        .card-title {

            font-size: 25px;

            font-weight: bold;

            text-align: center;

            margin-bottom: 20px;

        }

        .rating {

            text-align: center;

            color:goldenrod;

            margin-bottom: 10px;

        }

        .rate {

            color:black;

        }

        .course-details {

            list-style: none;

            margin-left: -30px;

        }

        .course-details li {

            margin-bottom: 15px;

        }

        .card-footer {

            display: grid;

            grid-template-columns: 6fr 6fr;

        }

        .btn-enroll {

            background-color: blue;

            color:white;

            padding: 15px;

            font-size: 20px;

            text-align: center;

            border-bottom-left-radius: 10px;

        }

        .btn-share {

             background-color: rgb(232, 232, 235);

            padding: 15px;

            font-size: 20px;

            text-align: center;

            border-bottom-right-radius: 10px;

        }

        main {

            display: flex;

            flex-direction: row;

        }

    </style>

</head>

<body>

    <nav>

        <span><a href="#java">Java</a></span>

        <span>|</span>

        <span><a href="#python">Python</a></span>

        <span>|</span>

        <span><a href="#devops">DevOps</a></span>

    </nav>

    <main>

        </div>

        <div class="card-body">

            <div class="card-title">Python & AI</div>

            <div class="rating">

                <span class="bi bi-star-fill"></span>

                <span class="bi bi-star-fill"></span>

                <span class="bi bi-star-fill"></span>

                <span class="bi bi-star-fill"></span>

                <span class="bi bi-star-fill"></span>

                <span class="rate">5</span>

            </div>

            <ul class="course-details">

                <li class="bi bi-calendar-date"> Date: 4 Aug 2026 </li>

                <li class="bi bi-person-fill"> By : Someone </li>

                <li class="bi bi-clock-history"> Dur: 6 Months </li>

            </ul>

        </div>

        <div class="card-footer">

            <div class="btn-enroll">Enroll</div>

            <div class="btn-share"> <span class="bi bi-share-fill"></span> Share </div>

        </div>

    </div>

</html>
