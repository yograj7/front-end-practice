<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../node_modules/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../node_modules/bootstrap/dist/css/bootstrap.css">
    <script src="../node_modules/bootstrap/dist/js/bootstrap.bundle.js"></script>
    <script>

        function SubmitClick(){
            document.getElementById("lblId").textContent = document.getElementById("txtId").value;
            document.getElementById("lblName").textContent = document.getElementById("txtName").value;
            document.getElementById("lblCategory").textContent = document.getElementById("lstCategories").value;
            document.getElementById("lblRating").textContent = document.getElementById("txtRating").value;

            stockCheckbox = document.getElementById("optStock");

            if(stockCheckbox.checked){
                document.getElementById("lblStock").textContent = "Available";
            } else {
                document.getElementById("lblStock").textContent = "Out of Stock";
            }

        }

    </script>
</head>
<body class="container-fluid row">

    <div class="card p-3 col m-2">
        <h4>Register Product</h4>
        <dl class="w-50">

            <dt>Product Id</dt>
            <dd><input type="number" class="form-control" id="txtId"></dd>
            <dt>Product Name</dt>
            <dd><input type="text" class="form-control" id="txtName"></dd>
            <dt>Category</dt>

            <dd>
                <select id="lstCategories" class="form-select">
                    <option>Select Category</option>
                    <option>Electronics</option>
                    <option>Fashion</option>
                </select>

            </dd>
            <dt>Stock</dt>
            <dd class="form-switch">
                <input type="checkbox" id="optStock" class="form-check-input"> <label class="form-check-label ms-2">Available</label>
            </dd>

            <dt>Rating</dt>
            <dd>
                <input type="range" id="txtRating" class="form-range" min="1" max="5" value="1"> 
                <div>
                    <span>1 <span class="bi bi-star-fill text-danger"></span> </span>
                    <span class="float-end">5 <span class="bi bi-star-fill text-success"></span> </span>
                </div>
            </dd>
            <dd>
                <button onclick="SubmitClick()" class="btn btn-warning mt-2 w-100">Submit</button>
            </dd>
        </dl>
    </div>

    <div class="card p-3 col m-2 alert alert-success alert-dismissible">
        <h4>Product Details</h4>
        <button class="btn btn-close" data-bs-dismiss="alert"></button>
        <dl class="row">
            <dt class="col-3">Product Id</dt>
            <dd class="col-9" id="lblId"></dd>
            <dt class="col-3">Product Name</dt>
            <dd class="col-9" id="lblName"></dd>
            <dt class="col-3">Category</dt>
            <dd class="col-9" id="lblCategory"></dd>
            <dt class="col-3">Stock</dt>
            <dd class="col-9" id="lblStock"></dd>
            <dt class="col-3">Rating</dt>
            <dd class="col-9" id="lblRating"></dd>
        </dl>
    </div>

</body>

</html>
