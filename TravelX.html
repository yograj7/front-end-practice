<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

        }

        nav{
            background-color: black;
            color: white;
            padding: 15px;
            padding-left: 30px;
            padding-right: 30px;
            display: flex;
            justify-content: space-between;
        }

        .shortcurt{
            display: flex;
            gap: 10px;
        }

        .entry-point{
            background-color: rgba(13, 83, 144, 0.842);
            color: white;
            display: flex;
            flex-direction: column;
            text-align: center;
            justify-content: center;
            padding: 60px;
            line-height: 40px;
        }

        .btn{
            background-color: white;
            color: rgba(13, 83, 144, 0.842);
            padding: 10px;
            border-radius: 10px;
            font-weight: bold;
        }

        .box-parent{
            display: grid;
            grid-template-columns: 1fr 1fr;
        }

        .grid-left{
            padding: 20px;
            gap: 10px;
        }


        .Paris{
            display: grid;
            grid-template-rows: 100px;
            border: 1px solid black;
            border-radius: 10px;
            padding: 10px;

            
        }

        .TS{
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 200px 100px;
            border: 1px solid black;
            gap: 10px;

        }

        .Toyako{
            display: grid;
            grid-template-rows: 200px;
            border: 1px solid black;
            border-radius: 10px;
            padding: 10px;
        }

        .Singapure{
            display: grid;
            grid-template-rows: 100px;
            border: 1px solid black;
            border-radius: 10px;
            padding: 10px;
            
        }


        .DLM{
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 100px 100px;
            border: 1px solid black;
            gap: 20px;
            padding: 20px;

        }

        .Dubai{
            border:  1px solid black;
             border-radius: 10px;
            padding: 10px;
        }

        .London{
            border:  1px solid black;
             border-radius: 10px;
            padding: 10px;
   
        }

        .Maldives{
            border: 1px solid black;
             border-radius: 10px;
            padding: 10px;
        }

        .switz{
            display: grid;
            grid-template-columns: 1fr;
            grid-template-rows: 100px;
            border: 1px solid black;
            padding: 20px;
        }

        .switzerland{
            border:  1px solid black;
            border-radius: 10px;
            padding: 10px;

        }

        /* footer{
            background-color: black;
            color: white;
            text-align: center;
            padding: 10px;
        } */

    </style>
</head>
<body>
    <nav>
        <span>TravelX</span>
        <div>
            <div class="shortcurt">
            <span>Home</span>
            <span>Destination</span>
            <span>Packages</span>
            <span>Contact</span>
        </div>
        </div>
    </nav>
    <div class="entry-point">
        <div>
            <h1>Explore The World</h1>
        <p>Lorem ipsum, dolor sit amet consectetur adipisicing.</p>
        <span class="btn">Book Now</span>
        </div>
    </div>
    <div class="box-parent">
      <div class="grid-left">
        <div class="Paris">
            <div>Paris</div>
        </div>
        <div class="TS">
            <div class="Toyako">Tokyo</div>
            <div class="Singapure">Singapure</div>
        </div>
      </div>
      
      <div class="grid-right">
        <div class="DLM">
            <div class="Dubai">Dubai</div>
            <div class="London">London</div>
            <div class="Maldives">Maldives</div>
        </div>
        <div class="switz">
            <div class="switzerland">Switzerland</div>
        </div>
      </div>
    </div>
    <footer>
        <p>&copy; 2026 TravelX</p>
    </footer>
</body>
</html>
