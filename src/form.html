<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form</title>
    <style>
        
    </style>
</head>
<body>
    <div class="card">
        <h1>TECHSTORE</h1>
        <h3>Vender Registration Portal</h3>
    <form action="" method="post"></form>
    <p>Vender Name</p>
    <input type="text" placeholder="Enter Vender Name" name="venderName" required autofocus>
    <p>Password</p>
    <input type="password" placeholder="Enter Password" required>
    <p>Buisness Email</p>
    <input type="email" placeholder="Enter Business email" required>
    <p>Company Website</p>
    <input type="url" placeholder="https://exaple.com">
    <p>Search Product</p>
    <input type="text" placeholder="Search product" list="product-list">
    <datalist id="product-list">
        <option value="Laptop"></option>
        <option value="Mobile"></option>
        <option value="TV"></option>
        <option value="Tablet"></option>
        <option value="Washing MC"></option>        
    </datalist>
    <p>Quantity</p>
    <input type="text" value="1">
    <p>Vender ID</p>
    <input type="text" value="TV1024" readonly>
    <p>GST Number</p>
    <input type="text" value="29ABCDE1234F1Z5" readonly>
<br>
    <input type="button" value="Register Vender">

    </div>
</body>
</html>
