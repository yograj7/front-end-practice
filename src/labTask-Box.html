<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            width: 300px;
            margin: 20px;
            padding: 20px;
            border: 5px solid red;
            box-sizing:border-box;

        }

        .box{
            width: 300px;
            margin: 20px;
            padding: 20px;
            border: 5px solid green;
            box-sizing:content-box;

        }

        
    </style>
</head>
<body>
    <div class="box">
        <h2>Content Box</h2>
        <p>width:300px</p>
        <p>padding : 20px</p>
        <p>border : 5</p>
        <p>Total width = 320 <b>+</b></p>
    </div>

    <div>
        <h2>Content Box</h2>
        <p>width:300px</p>
        <p>padding : 20px</p>
        <p>border : 5</p>
        <p>Total width = 320</p>
    </div>
</body>
</html>
